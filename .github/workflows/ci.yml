# HustleHub+ CI/CD pipeline
# Runs on every push to main, every pull request and on demand. Any failing test, build,
# dependency audit or static analysis check fails the pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  backend:
    name: Backend - audit, unit tests, build, API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hustlehub-backend

    env:
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/hustlehub-ci
      CLIENT_ORIGIN: https://localhost:5173
      ADMIN_EMAIL: ci-admin@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hustlehub-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dev-only tools (Newman) never ship, so only production dependencies are gated
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test:unit

      - name: Build check
        run: |
          find server.js app.js config controllers middleware models routes scripts -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "require('./app'); console.log('App module loads')"

      # Throwaway database for the Newman API tests. Started as a step rather than a
      # service container so a startup problem prints the database log instead of failing silently
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" > /dev/null 2>&1 \
              && echo "MongoDB is up" && exit 0
            sleep 2
          done
          echo "MongoDB did not start"; docker logs mongo; exit 1

      # Secrets are generated per run so nothing sensitive lives in the repository
      - name: Generate CI secrets and TLS certificate
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=Ci$(openssl rand -hex 12)!a" >> "$GITHUB_ENV"
          mkdir -p ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ssl/key.pem -out ssl/cert.pem -subj "/CN=localhost"

      - name: Seed admin account
        run: npm run seed:admin

      - name: Start API server
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sk https://localhost:5000/ > /dev/null && echo "API is up" && exit 0
            sleep 1
          done
          echo "API did not start"; cat server.log; exit 1

      - name: API endpoint tests (Newman)
        run: >-
          npm test --
          --env-var "adminEmail=$ADMIN_EMAIL"
          --env-var "adminPassword=$ADMIN_PASSWORD"
          --reporters cli,junit
          --reporter-junit-export reports/newman-gigs.xml

      # Runs last because it deliberately locks the auth rate limiter
      - name: Rate limit tests (Newman)
        run: >-
          npm run test:rate-limits --
          --reporters cli,junit
          --reporter-junit-export reports/newman-rate-limits.xml

      - name: Upload test reports and server log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            hustlehub-backend/reports/
            hustlehub-backend/server.log
          retention-days: 30

  frontend:
    name: Frontend - audit, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hustlehub-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hustlehub-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit and component tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://localhost:5000/api

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hustlehub-frontend/dist/
          retention-days: 7

  docker:
    name: Docker - build and run full stack
    runs-on: ubuntu-latest
    # Only containerise code that has already passed its tests
    needs: [backend, frontend]

    env:
      ADMIN_EMAIL: ci-admin@example.com

    steps:
      - uses: actions/checkout@v4

      # Compose reads secrets from hustlehub-backend/.env and mounts the certificate from ssl/
      - name: Generate CI secrets and TLS certificate
        working-directory: hustlehub-backend
        run: |
          ADMIN_PASSWORD="Ci$(openssl rand -hex 12)!a"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } > .env
          mkdir -p ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ssl/key.pem -out ssl/cert.pem -subj "/CN=localhost"
          chmod 644 ssl/key.pem

      - name: Build images and start containers
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Show running containers
        run: docker compose ps

      - name: Smoke test containers
        run: |
          curl -fsk https://localhost:5000/ | grep -q '"success":true'
          echo "API container responds over HTTPS"
          curl -fs http://localhost:5173/ | grep -q '<div id="root">'
          echo "Frontend container serves the app"
          curl -fsI http://localhost:5173/ | grep -qi '^content-security-policy:'
          echo "Frontend container sends a Content Security Policy"
          curl -fs http://localhost:5173/gigs | grep -q '<div id="root">'
          echo "Client-side routes fall back to index.html"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hustlehub-backend/package-lock.json

      - name: Install Newman
        working-directory: hustlehub-backend
        run: npm ci

      - name: Seed admin account in the container
        run: docker compose exec -T backend npm run seed:admin

      - name: API endpoint tests against the containerised stack (Newman)
        working-directory: hustlehub-backend
        run: >-
          npm test --
          --env-var "adminEmail=$ADMIN_EMAIL"
          --env-var "adminPassword=$ADMIN_PASSWORD"
          --reporters cli,junit
          --reporter-junit-export reports/newman-docker.xml

      - name: Container logs
        if: ${{ !cancelled() }}
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload container logs and test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-run-reports
          path: |
            docker-compose.log
            hustlehub-backend/reports/
          retention-days: 30

      - name: Stop containers
        if: ${{ always() }}
        run: docker compose down -v

  semgrep:
    name: Static analysis - Semgrep
    runs-on: ubuntu-latest
    # actions: read lets the upload step look up this run, which private repos require
    permissions:
      contents: read
      actions: read
      security-events: write
    container:
      image: semgrep/semgrep:1.140.0

    # Security rulesets for Node/Express, React, JWT, leaked secrets and the Docker setup.
    # node_password is excluded because it flags any identifier named "password"
    # (e.g. form validation messages) rather than actual hardcoded credentials.
    env:
      SEMGREP_ARGS: >-
        --config p/javascript
        --config p/nodejsscan
        --config p/react
        --config p/jwt
        --config p/secrets
        --config p/dockerfile
        --config p/docker-compose
        --severity ERROR
        --severity WARNING
        --exclude-rule ajinabraham.njsscan.generic.hardcoded_secrets.node_password
        --metrics=off

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: semgrep scan $SEMGREP_ARGS --error

      # Separate run because SARIF output also lists findings reviewed with nosemgrep
      # (marked as suppressed), which would otherwise fail the scan above
      - name: Generate SARIF report
        if: ${{ !cancelled() }}
        run: semgrep scan $SEMGREP_ARGS --sarif --output semgrep.sarif || true

      # The Security tab (code scanning) needs GitHub Advanced Security on private repos,
      # so there the SARIF report is kept as a downloadable artifact only (next step)
      - name: Upload results to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep report
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 30

  # CodeQL is free for public repositories; private repos need GitHub Advanced Security,
  # so the job is skipped there and Semgrep remains the static analysis gate
  codeql:
    name: Static analysis - CodeQL
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql
